name: retry action
author: |
  Wandalen <wandalen@obox.systems>
  dmvict <dm.vict.kr@gmail.com>
branding:
  icon: activity
  color: white
description: Retries an Github Action step on failure
inputs:
  action:
    description: 'Github action name. Should be defined action or command, not both.'
    required: false
  command:
    description: 'Command to run. Should be defined action or command, not both.'
    required: false
  pre_retry_command:
    description: Command to run between retries.
    required: false
  with:
    description: An options map for Github action
    required: false
  current_path:
    description: >-
      Setup working directory for the action. Works with only commands. Default
      is `github.workspace` path.
    required: false
  steps_context:
    description: >-
      Pass context `steps` into an external action. If you need valid context
      `steps`, then add option as described in `Readme.md`.
    required: false
    default: '{}'
  attempt_limit:
    description: Number of attempts
    required: false
    default: 2
  attempt_delay:
    description: A delay between attempts in ms
    required: false
    default: 0
  time_out:
    description: >-
      Set time out in ms for entire step including all retries. By default
      actions sets no time out.
    required: false
    default: false
  retry_condition:
    description: >-
      Use any valid expression to decide the continuation of retries. Default
      value is true.
    required: false
    default: true
  github_token:
    description: A token to access private actions. Does not required for public actions. Also passed as `github.token` to the wrapped action.
    required: false
    default: '${{ github.token }}'
  env_context:
    description: >-
      Optional override of context `env` as a JSON string.
      If omitted, the action rebuilds `env` automatically from the process
      environment.
    required: false
  github_context:
    description: >-
      Optional override of context `github` as a JSON string.
      If omitted, the action rebuilds `github` automatically.
    required: false
  inputs_context:
    description: >-
      Optional context `inputs` as a JSON string.
      Empty unless provided.
    required: false
  job_context:
    description: >-
      Optional context `job` as a JSON string.
      Empty unless provided.
    required: false
  matrix_context:
    description: >-
      Optional context `matrix` as a JSON string.
      Empty unless provided.
    required: false
outputs:
  outputs:
    description: A pretty print JSON map with outputs from the wrapped action.
runs:
  using: node24
  main: Main.js
