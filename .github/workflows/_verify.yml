name: verify

# The Node 20 deprecation gate (issue #193) is best-effort: annotations may be
# published only after the job completes, so it can miss them. It fails only on
# annotations that name the local action under test.

on:
  workflow_call:
    inputs:
      artifact_name:
        type: string
        required: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.11.0
      - name: Install dependencies
        shell: bash
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact_name }}
          path: artifact
      - name: Use the Joined.s of the built artifact
        shell: bash
        run: |
          (cd artifact && sha256sum -c wretry-action-dist.tar.gz.sha256 || shasum -a 256 -c wretry-action-dist.tar.gz.sha256)
          mkdir extracted test-logs
          tar -xzf artifact/wretry-action-dist.tar.gz -C extracted ./node_modules/Joined.s
          cp extracted/node_modules/Joined.s node_modules/Joined.s
      - name: Clone suite
        shell: bash
        env:
          NODE_OPTIONS: --require ${{ github.workspace }}/step/node24-shim.js
        run: node test/Clone.test.s v:2 2>&1 | tee test-logs/Clone.log
      - name: Common suite
        if: ${{ !cancelled() }}
        shell: bash
        env:
          NODE_OPTIONS: --require ${{ github.workspace }}/step/node24-shim.js
        run: node test/Common.test.s v:2 2>&1 | tee test-logs/Common.log
      - name: Command suite
        if: ${{ !cancelled() }}
        shell: bash
        env:
          NODE_OPTIONS: --require ${{ github.workspace }}/step/node24-shim.js
        run: node test/Command.test.s v:2 2>&1 | tee test-logs/Command.log
      - name: Action suite
        if: ${{ !cancelled() }}
        shell: bash
        env:
          NODE_OPTIONS: --require ${{ github.workspace }}/step/node24-shim.js
        run: node test/Action.test.s v:2 2>&1 | tee test-logs/Action.log
      - name: Docker suite
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        shell: bash
        env:
          NODE_OPTIONS: --require ${{ github.workspace }}/step/node24-shim.js
        run: node test/Docker.test.s v:2 2>&1 | tee test-logs/Docker.log
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-logs-${{ matrix.os }}
          path: test-logs

  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact_name }}
          path: artifact
      - name: Extract artifact
        shell: bash
        run: |
          (cd artifact && sha256sum -c wretry-action-dist.tar.gz.sha256 || shasum -a 256 -c wretry-action-dist.tar.gz.sha256)
          mkdir dist
          tar -xzf artifact/wretry-action-dist.tar.gz -C dist
      - name: Write fixtures
        shell: bash
        run: |
          mkdir -p .smoke/fixture .smoke/docker
          D='$'
          cat > .smoke/fixture/action.yml <<YML
          name: fixture
          inputs:
            who:
              default: nobody
            job_status:
              default: "${D}{{ job.status }}"
            matrix_os:
              default: "${D}{{ matrix.os }}"
          outputs:
            value:
              description: value
            job_status:
              description: job status
            matrix_os:
              description: matrix os
          runs:
            using: node24
            main: main.js
          YML
          cat > .smoke/fixture/main.js <<'JS'
          const fs = require( 'fs' );
          const e = process.env;
          fs.appendFileSync( e.GITHUB_OUTPUT, `value=hello-${ e.INPUT_WHO }\njob_status=${ e.INPUT_JOB_STATUS }\nmatrix_os=${ e.INPUT_MATRIX_OS }\n` );
          JS
          cat > .smoke/docker/action.yml <<'YML'
          name: docker-fixture
          runs:
            using: docker
            image: Dockerfile
          YML
          cat > .smoke/docker/Dockerfile <<'DF'
          FROM alpine:3.20
          ENTRYPOINT ["sh", "-c", "echo hello-docker"]
          DF
          cat > .smoke/flaky.js <<'JS'
          const fs = require( 'fs' );
          const f = '.smoke/flaky.count';
          const n = ( fs.existsSync( f ) ? Number( fs.readFileSync( f, 'utf8' ) ) : 0 ) + 1;
          fs.writeFileSync( f, String( n ) );
          process.exit( n >= Number( process.argv[ 2 ] ) ? 0 : 1 );
          JS
          cat > .smoke/count.js <<'JS'
          require( 'fs' ).appendFileSync( '.smoke/count.log', 'x\n' );
          process.exit( 1 );
          JS
          cat > .smoke/mark.js <<'JS'
          require( 'fs' ).appendFileSync( '.smoke/pre_retry.log', 'x\n' );
          JS

      - name: Command mode, fails twice then passes
        uses: ./dist
        with:
          command: node .smoke/flaky.js 3
          pre_retry_command: node .smoke/mark.js
          attempt_limit: 3
      - name: Assert pre_retry_command ran between attempts
        shell: bash
        run: test "$(wc -l < .smoke/pre_retry.log | tr -d ' ')" = "2"

      - name: Command mode, always failing
        id: always_fail
        uses: ./dist
        continue-on-error: true
        with:
          command: node -e "process.exit(1)"
          attempt_limit: 2
      - name: Assert the always-failing step failed
        if: steps.always_fail.outcome != 'failure'
        shell: bash
        run: exit 1

      - name: Action mode, public JS action
        id: public_action
        uses: ./dist
        with:
          action: actions/hello-world-javascript-action@v1.1
          with: |
            who-to-greet: smoke
          attempt_limit: 2

      - name: Action mode, local action with job and matrix contexts
        id: local_action
        uses: ./dist
        with:
          action: ./.smoke/fixture
          with: |
            who: smoke
          job_context: ${{ toJSON( job ) }}
          matrix_context: ${{ toJSON( matrix ) }}
          attempt_limit: 2
      - name: Assert outputs and contexts
        shell: bash
        env:
          VALUE: ${{ fromJSON( steps.local_action.outputs.outputs ).value }}
          JOB_STATUS: ${{ fromJSON( steps.local_action.outputs.outputs ).job_status }}
          MATRIX_OS: ${{ fromJSON( steps.local_action.outputs.outputs ).matrix_os }}
          EXPECTED_OS: ${{ matrix.os }}
        run: |
          test "$VALUE" = "hello-smoke"
          test "$JOB_STATUS" = "success"
          test "$MATRIX_OS" = "$EXPECTED_OS"

      - name: time_out
        id: time_out
        uses: ./dist
        continue-on-error: true
        with:
          command: node -e "setTimeout(() => {}, 120000)"
          attempt_limit: 3
          time_out: 5000
      - name: Assert time_out failed the step
        if: steps.time_out.outcome != 'failure'
        shell: bash
        run: exit 1

      - name: retry_condition stops retries
        id: retry_condition
        uses: ./dist
        continue-on-error: true
        with:
          command: node .smoke/count.js
          attempt_limit: 5
          retry_condition: false
      - name: Assert a single attempt was made
        shell: bash
        env:
          OUTCOME: ${{ steps.retry_condition.outcome }}
        run: |
          test "$OUTCOME" = "failure"
          test "$(wc -l < .smoke/count.log | tr -d ' ')" = "1"

      - name: Docker action
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        uses: ./dist
        with:
          action: ./.smoke/docker
          attempt_limit: 2

      - name: Node 20 deprecation gate (best-effort)
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
            --jq ".jobs[] | select(.runner_name == \"$RUNNER_NAME\") | .id" | head -n 1) || id=
          if [ -z "$id" ]; then echo "::warning::Could not resolve the job id, gate skipped"; exit 0; fi
          msgs=$(gh api "repos/$GITHUB_REPOSITORY/check-runs/$id/annotations" --jq '.[] | select(.message | test("Node.js 20")) | .message') || msgs=
          echo "$msgs"
          if echo "$msgs" | grep -E -q '\./dist|\.smoke'; then
            echo "::error::Node 20 deprecation annotation names the local action"
            exit 1
          fi

  smoke_job_services:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 5432
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact_name }}
          path: artifact
      - name: Extract artifact
        run: |
          mkdir dist
          tar -xzf artifact/wretry-action-dist.tar.gz -C dist
      - name: Job context with services
        uses: ./dist
        env:
          JOB: ${{ toJSON( job ) }}
        with:
          command: node -e "const j = JSON.parse(process.env.JOB); if (!j.services || !j.services.postgres) process.exit(1)"
          job_context: ${{ toJSON( job ) }}
          attempt_limit: 3
          attempt_delay: 1000
