# See https://github.com/typesafegithub/github-actions-typing/
inputs:
  action:
    type: string

  command:
    type: string

  pre_retry_command:
    type: string

  with:
    type: string

  current_path:
    type: string

  steps_context:
    type: string

  attempt_limit:
    type: integer

  attempt_delay:
    type: integer

  time_out:
    type: integer

  retry_condition:
    type: string

  github_token:
    type: string

  env_context:
    type: string

  github_context:
    type: string

  inputs_context:
    type: string

  job_context:
    type: string

  matrix_context:
    type: string

outputs:
  outputs:
    type: string
